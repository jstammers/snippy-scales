# cliff.toml — git-cliff changelog generation configuration.
#
# Usage:
#   git cliff --unreleased            Preview unreleased changes
#   git cliff --unreleased --tag 1.0.0 Tag-preview (before tagging)
#   git cliff -o CHANGELOG.md         Full changelog to file
#   git cliff --latest -o CHANGELOG.md Prepend latest release only
#
# Installation:  cargo install git-cliff
#                  or: https://git-cliff.org/docs/installation

[changelog]
# Tera (Jinja2-compatible) template for each release section.
header = """
# Changelog\n
All notable changes to SnippyScales are documented here.\n
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first | trim }}\
{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

# Strip trailing whitespace from every section.
trim = true

footer = """
<!-- generated by git-cliff -->
"""

# ── Git parsing ───────────────────────────────────────────────────────────────
[git]
conventional_commits    = true
# Filter out any commit that doesn't match conventional format.
filter_unconventional   = true
# Don't split multi-line commit bodies into separate entries.
split_commits           = false

# Breaking changes: honour both the `!` shorthand and the `BREAKING CHANGE:` footer.
protect_breaking_commits = true

# Tag pattern — only v-prefixed semver tags drive releases.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"

# Skip pre-release tags from changelog sections (they're noise for most readers).
skip_tags   = "v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc).*"

# Sort oldest → newest within each release block.
sort_commits = "oldest"
topo_order   = false

# Auto-link GitHub issues and PRs in commit messages.
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/yourorg/snippy-scales/issues/$1" },
  { pattern = "PR#(\\d+)", href = "https://github.com/yourorg/snippy-scales/pull/$1" },
]

# Commit preprocessors: clean up common noise before grouping.
commit_preprocessors = [
  # Strip trailing periods from the subject line.
  { pattern = "\\.$", replace = "" },
  # Normalise "wip:" prefixes — they shouldn't appear in a release anyway.
  { pattern = "(?i)^wip[: ]", replace = "chore: wip — " },
]

# Commit parsers: map types → changelog section headings.
# Order matters — first match wins.
commit_parsers = [
  # ── Skipped (never appear in changelog) ─────────────────────────────────
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^style", skip = true },

  # ── Features (semver MINOR) ──────────────────────────────────────────────
  { message = "^feat",     group = "🚀 Features" },

  # ── Bug Fixes (semver PATCH) ─────────────────────────────────────────────
  { message = "^fix",      group = "🐛 Bug Fixes" },

  # ── Performance (semver PATCH) ───────────────────────────────────────────
  { message = "^perf",     group = "⚡ Performance" },

  # ── Refactor (informational) ──────────────────────────────────────────────
  { message = "^refactor", group = "🚜 Refactor" },

  # ── Reverts ───────────────────────────────────────────────────────────────
  { message = "^revert",   group = "⏪ Reverts" },

  # ── Documentation ─────────────────────────────────────────────────────────
  { message = "^doc",      group = "📚 Documentation" },

  # ── Testing ───────────────────────────────────────────────────────────────
  { message = "^test",     group = "🧪 Testing" },

  # ── Build / CI ────────────────────────────────────────────────────────────
  { message = "^build",    group = "🏗️ Build System" },
  { message = "^ci",       group = "👷 CI/CD" },

  # ── General chores (catch-all, still skipped unless breaking) ────────────
  { message = "^chore",    skip = true },
]
