name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Python lint + type-check ─────────────────────────────────────────────────
  python-lint:
    name: Python — ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Ruff lint
        run: just lint-py-ci

      - name: Ruff format check
        run: just fmt-py-check

      - name: ty type check
        run: just type-check

  # ── Python tests (waits for lint to pass) ────────────────────────────────────
  python-test:
    name: Python — pytest
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Run pytest
        run: just test-py-cov-ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Build Python wheel (release build validation) ────────────────────────────
  build-wheel:
    name: Build — wheel
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: uv build
