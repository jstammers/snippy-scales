[project]
name = "snippy-scales"
version = "0.1.0"
description = "Algorithmic trading research platform built on NautilusTrader"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=15",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.4",
    "databento>=0.35",
    "pyyaml>=6",
    "pydantic>=2.7",
    "loguru>=0.7",
    # Exact pin: v2 is a release candidate with breaking changes between RCs.
    # The catalog contract tests (test_nautilus_contract.py) guard upgrades.
    # `visualization` adds plotly for Nautilus tearsheets (`algo eval tearsheet`).
    "nautilus_trader[visualization]==2.0.0rc6",
    # Walk-forward parameter search and the experiment store (evaluation/walk_forward.py).
    "optuna>=4.0",
    "duckdb>=1.0",
    "scoringrules>=0.11",
    "altair>=6.2.2",
    "ipython>=9.17.1",
    "statsmodels>=0.15.0",
    "alpaca-py>=0.44.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "numba>=0.61",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
]

[project.scripts]
algo = "snippy_scales.cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/snippy_scales"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "ty>=0.0.1a5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    # Release tooling
    "twine>=5",
    # Docs
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "marimo>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["ANN", "TC003"]
# Optuna trials and Nautilus objects are loosely typed; Any is necessary for interop.
"python/snippy_scales/evaluation/**" = ["ANN401"]
# CLI modules must import Path unconditionally so typer can resolve annotations
# at runtime — moving it to TYPE_CHECKING (TC003) would break typer.
"python/snippy_scales/cli/**" = ["TC003", "ANN401"]
# marimo notebooks: cells are functions of their (untyped) dependencies, and
# markdown cells hold tables wider than the code limit.
"reports/templates/**" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
root = ["python"]

[tool.ty.src]
# Spike code that imports libraries outside the project (scripts/spike_vectorised/README.md).
exclude = ["scripts/spike_vectorised"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["python/snippy_scales"]
branch = true

# ── git-cliff reads cliff.toml at repo root automatically ─────────────────────
# Pointer so tooling (e.g. renovate) can discover the cliff config.
[tool.git-cliff]
config = "cliff.toml"
