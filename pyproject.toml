[project]
name = "snippy-scales"
version = "0.1.0"
description = "Modular Python-Rust algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.2",
    "polars>=0.20",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "databento>=0.35",
    "pyyaml>=6",
    "maturin>=1.5",
    "pydantic>=2.7",
    "loguru>=0.7",
    "raptorbt>=0.3.2",
    "quantstats>=0.0.62",
]

[project.optional-dependencies]
optuna = ["optuna>=3.6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
]

[project.scripts]
algo = "snippy_scales.cli.main:app"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[tool.maturin]
# algo-pyo3 exposes the Rust core to Python
manifest-path = "rust/algo-pyo3/Cargo.toml"
module-name = "snippy_scales._algo_core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "ty>=0.0.1a5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    # Release tooling
    "twine>=5",
    # Docs
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["ANN", "TC003"]
# raptorbt is a Rust extension without type stubs; Any is necessary for interop.
"python/snippy_scales/backtesting/**" = ["ANN401"]
# quantstats/pandas have no complete type stubs; Any is necessary for interop.
"python/snippy_scales/evaluation/**" = ["ANN401"]
# CLI modules must import Path unconditionally so typer can resolve annotations
# at runtime — moving it to TYPE_CHECKING (TC003) would break typer.
"python/snippy_scales/cli/**" = ["TC003", "ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
root = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["python/snippy_scales"]
branch = true

# ── git-cliff reads cliff.toml at repo root automatically ─────────────────────
# Pointer so tooling (e.g. renovate) can discover the cliff config.
[tool.git-cliff]
config = "cliff.toml"
