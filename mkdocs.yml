site_name: SnippyScales
site_description: Quantitative trading research platform built on NautilusTrader
repo_url: https://github.com/yourorg/snippy-scales
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Backtesting & Evaluation: architecture/backtest_engine.md
      - NautilusTrader Migration: architecture/nautilus_migration.md
      - "Spike: Vectorised Screening": architecture/vectorised_screening_spike.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - Adding a Strategy: guides/adding_strategy.md
      - Data Ingestion: guides/data_ingestion.md
      - Strategy Reports: guides/strategy_reports.md
  - Strategies:
      - Time-series momentum: strategies/momentum-ts.md
      - Moving-average trend following: strategies/trend-following.md
      - Cross-sectional momentum: strategies/momentum-cs.md
  - Research:
      - SDEs and Neural SDEs: research/sde_market_dynamics.md
      - raptorbt Defects (historical): research/raptorbt_defects.md
      - "Spike: vectorbt vs raptorbt": research/vectorised_engines_spike.md
  - API Reference:
      - Python: api/python/index.md
      - Data: api/python/data.md
      - Strategies: api/python/strategies.md
      - Execution: api/python/execution.md
      - Evaluation: api/python/evaluation.md
