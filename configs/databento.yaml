# ---------------------------------------------------------------------------
# Databento ingestion configuration
# ---------------------------------------------------------------------------
# Pass this file to the CLI:
#   algo data ingest-config configs/databento.yaml
#   algo data ingest-config configs/databento.yaml --schema 1h
#
# Symbols use Databento continuous-contract notation:
#   <ROOT>.c.0  → front-month continuous
#   <ROOT>.c.1  → second-month continuous
# Individual expiries can also be used (e.g. ESZ2024).
# ---------------------------------------------------------------------------

# Closed top-level storage classification — determines the
# data/raw/<instrument_type>/ subdirectory. Every symbol below is a futures
# contract (equity index, rate, fx, or commodity futures), so this whole
# file is "futures" — separate from the asset_classes labels below, which
# are just a display/grouping label, not a storage key.
instrument_type: "futures"

# Databento dataset — CME Globex multi-asset feed
dataset: "GLBX.MDP3"

# Schemas to ingest — bar aliases (1d / daily / 1h / 1m / 1min / 1s / eod) and/or
# event-level schema names (trades / mbo / mbp-1 / mbp-10 / tbbo). Every entry is
# ingested for every symbol below. Narrow to one at runtime via --schema.
schemas: ["1d"]

# Historical pull range
start: "2010-06-06"
# end: "2024-12-31"  # Omit to default to today

# stype_in applies to every symbol in this config. To also pull every
# individual outright contract under a root (e.g. for verifying a continuous
# contract's rolls), use Databento parent symbology — a symbol like "ES.FUT"
# with stype_in: parent returns every contract active in the date range in
# one request. Since stype_in is set once per config, do that as a separate
# config/asset-class run rather than mixing it with the continuous symbols
# below:
#   algo data ingest GLBX.MDP3 -s ES.FUT --schema 1d --stype-in parent \
#     --start 2010-06-06 --end 2024-12-31
stype_in: "continuous"
# ---------------------------------------------------------------------------
# Asset classes
# Each key is a human-readable label; symbols must be valid Databento
# identifiers for the dataset above.
# ---------------------------------------------------------------------------
asset_classes:

  # --- Equity Index Futures ---
  equity_index:
    symbols:
      - ES.c.0   # E-mini S&P 500
      - NQ.c.0   # E-mini Nasdaq-100
      - YM.c.0   # E-mini Dow Jones
      - RTY.c.0  # E-mini Russell 2000

  # --- Interest Rate Futures ---
  rates:
    symbols:
      - ZT.c.0   # 2-Year Treasury
      - ZF.c.0   # 5-Year Treasury
      - ZN.c.0   # 10-Year Treasury
      - ZB.c.0   # 30-Year Treasury

  # --- FX Futures ---
  fx:
    symbols:
      - 6E.c.0   # EUR/USD
      - 6J.c.0   # JPY/USD
      - 6B.c.0   # GBP/USD
      - 6A.c.0   # AUD/USD

  # --- Commodity Futures ---
  commodities:
    symbols:
      - CL.c.0   # Crude Oil (WTI)
      - NG.c.0   # Natural Gas
      - GC.c.0   # Gold
      - SI.c.0   # Silver
      - ZC.c.0   # Corn
      - ZW.c.0   # Wheat
      - ZS.c.0   # Soybeans
