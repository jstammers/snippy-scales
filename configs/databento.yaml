# ---------------------------------------------------------------------------
# Databento sync configuration
# ---------------------------------------------------------------------------
# Pass this file to the CLI:
#   algo data sync configs/databento.yaml --dry-run    # what's missing + cost
#   algo data sync configs/databento.yaml
#   algo data sync configs/databento.yaml --schema 1h
#
# Symbols use Databento continuous-contract notation:
#   <ROOT>.c.0  → front-month continuous
#   <ROOT>.c.1  → second-month continuous
# Individual expiries can also be used (e.g. ESZ2024).
# ---------------------------------------------------------------------------

# Databento dataset — CME Globex multi-asset feed. Catalog instrument IDs use
# the venue GLBX (e.g. ES.c.0.GLBX); override with `venue:` if needed.
dataset: "GLBX.MDP3"

# Schemas to sync — bar aliases (1d / daily / 1h / 1m / 1min / 1s) and/or
# event-level schema names (trades / tbbo / mbp-1 / bbo-1s / bbo-1m / mbo /
# mbp-10). Every entry is synced for every symbol below. Narrow to one at
# runtime via --schema.
schemas: ["1d"]

# Historical pull range
start: "2010-06-06"
# end: "2024-12-31"  # Omit to default to today

# stype_in is used for cost estimates; when omitted it is inferred from each
# symbol's form (ES.c.0 -> continuous, ES.FUT -> parent, ESZ4 -> raw_symbol).
# To pull every outright contract under a root (e.g. for real-contract
# backtests with rolls), add parent symbols such as "ES.FUT" in a separate
# config.
stype_in: "continuous"
# ---------------------------------------------------------------------------
# Asset classes
# Each key is a human-readable label; symbols must be valid Databento
# identifiers for the dataset above.
# ---------------------------------------------------------------------------
asset_classes:

  # --- Equity Index Futures ---
  equity_index:
    symbols:
      - ES.c.0   # E-mini S&P 500
      - NQ.c.0   # E-mini Nasdaq-100
      - YM.c.0   # E-mini Dow Jones
      - RTY.c.0  # E-mini Russell 2000

  # --- Interest Rate Futures ---
  rates:
    symbols:
      - ZT.c.0   # 2-Year Treasury
      - ZF.c.0   # 5-Year Treasury
      - ZN.c.0   # 10-Year Treasury
      - ZB.c.0   # 30-Year Treasury

  # --- FX Futures ---
  fx:
    symbols:
      - 6E.c.0   # EUR/USD
      - 6J.c.0   # JPY/USD
      - 6B.c.0   # GBP/USD
      - 6A.c.0   # AUD/USD

  # --- Commodity Futures ---
  commodities:
    symbols:
      - CL.c.0   # Crude Oil (WTI)
      - NG.c.0   # Natural Gas
      - GC.c.0   # Gold
      - SI.c.0   # Silver
      - ZC.c.0   # Corn
      - ZW.c.0   # Wheat
      - ZS.c.0   # Soybeans
