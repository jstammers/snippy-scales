# Diversifying ETFs for blending with futures TSMOM (bonds, cash, credit, real assets,
# international equity, dollar). Daily, dividend-adjusted (total return), free tier.
#   algo data sync configs/alpaca_etfs.yaml
provider: "alpaca"
schemas: ["1d"]
start: "2016-01-01"
alpaca:
  feed: "sip"
  adjustment: "all"
  rate_limit_per_min: 190
  max_workers: 4
asset_classes:
  us_equity:
    symbols: [SPY, QQQ, IWM]
  treasuries:
    symbols: [BIL, SHY, IEF, TLT, TIP]
  credit:
    symbols: [AGG, LQD, HYG]
  real_assets:
    symbols: [GLD, SLV, DBC, VNQ]
  international_equity:
    symbols: [EFA, EEM, VGK, EWJ]
  currency:
    symbols: [UUP]
