# Replication of Moskowitz, Ooi & Pedersen (2012), "Time Series Momentum", on the
# 34 CME futures with clean daily data since 2010 (Databento GLBX, front month
# rolled 5 trading days before the calendar switch: `<ROOT>.ROLL`).
#   algo data sync configs/databento_tsmom_cme.yaml        # bars + contract mappings
#   algo report new tsmom-futures --from reports/templates/configs/tsmom_futures.yaml
#   algo report build tsmom-futures
#
# Paper settings: sign of the past k-month return, position 40% / ex-ante vol, no
# leverage cap, monthly rebalance, equal weight across instruments. The search is
# the paper's lookback grid k = 1, 3, 6, 9, 12 months (holding period 1 month).
#
# Excluded roots (see docs/research/tsmom_replication.md): TN, 6M, PL, PA (the
# calendar front month is too sparse to price rolls) and GE, SR3 (short-rate
# futures, not in the paper's universe).
name: tsmom-futures
title: Time-series momentum on diversified futures (MOP 2012 replication)
strategy: momentum-ts
theory: docs/strategies/momentum-ts-futures.md
question: >-
  Does the diversified time-series momentum strategy of Moskowitz, Ooi & Pedersen
  (2012), built with the paper's own rules on 34 CME futures across equity indices,
  government bonds, currencies and commodities, earn the Sharpe ratio above one the
  paper reports for 1985-2009, out of sample over 2010-2026 and after costs?
data:
  symbols:
    # Equity indices
    - ES.ROLL
    - NQ.ROLL
    - YM.ROLL
    - RTY.ROLL
    - NKD.ROLL
    - EMD.ROLL
    # Government bonds
    - ZT.ROLL
    - ZF.ROLL
    - ZN.ROLL
    - ZB.ROLL
    - UB.ROLL
    # Currencies
    - 6A.ROLL
    - 6B.ROLL
    - 6C.ROLL
    - 6E.ROLL
    - 6J.ROLL
    - 6S.ROLL
    - 6N.ROLL
    # Energy
    - CL.ROLL
    - HO.ROLL
    - RB.ROLL
    - NG.ROLL
    # Metals
    - GC.ROLL
    - SI.ROLL
    - HG.ROLL
    # Agriculture and livestock
    - ZC.ROLL
    - ZS.ROLL
    - ZW.ROLL
    - KE.ROLL
    - ZL.ROLL
    - ZM.ROLL
    - LE.ROLL
    - HE.ROLL
    - GF.ROLL
  venue: GLBX
  schema: ohlcv-1d
  benchmark: ES.ROLL
  example_symbol: CL.ROLL
evaluation:
  n_splits: 5
  test_size: 0.15                # 5 x 15% of ~4,270 weekday closes: OOS from ~2014
  min_train: 252
  # Large capital so whole-contract rounding is negligible at 1/34 weight per root.
  initial_capital: 1000000000
  commission_rate: 0.0
  commission_per_contract: 2.0   # ~exchange + broker fees per contract per side
  slippage_prob: 0.0
  rebalance_band: 0.0
  leverage: 20.0                 # bond legs run at 10-25x their 1/N capital
screening:
  engine: vector
  sampler: grid
  space:
    lookback: [21, 63, 126, 189, 252]   # k = 1, 3, 6, 9, 12 months
    skip_recent: [0]                    # MOP: no skip
    vol_target: [0.40]                  # MOP: 40% per instrument
    vol_lookback: [63]                  # ~EWMA centre of mass 60 days
    max_leverage: [50.0]                # MOP: no cap (2-year notes need ~27x)
    rebal_freq: [21]                    # monthly
validation:
  top_k: 5
