# Does adding commodity basis-momentum improve the lead trend configuration on
# 34 CME futures? basis_weight 0 is the baseline, in the grid.
#   algo report new trend-basis --from reports/templates/configs/trend_basis.yaml
#   algo report build trend-basis
name: trend-basis
title: Trend plus commodity basis-momentum, 34 CME futures
strategy: trend-carry
question: >-
  Does adding a basis-momentum position in commodities to tranched trend (equities
  long-or-flat, 10% portfolio volatility target) raise the out-of-sample Sharpe ratio
  on 34 CME futures?
data:
  symbols:
    # Equity indices
    - ES.ROLL
    - NQ.ROLL
    - YM.ROLL
    - RTY.ROLL
    - NKD.ROLL
    - EMD.ROLL
    # Government bonds
    - ZT.ROLL
    - ZF.ROLL
    - ZN.ROLL
    - ZB.ROLL
    - UB.ROLL
    # Currencies
    - 6A.ROLL
    - 6B.ROLL
    - 6C.ROLL
    - 6E.ROLL
    - 6J.ROLL
    - 6S.ROLL
    - 6N.ROLL
    # Energy
    - CL.ROLL
    - HO.ROLL
    - RB.ROLL
    - NG.ROLL
    # Metals
    - GC.ROLL
    - SI.ROLL
    - HG.ROLL
    # Agriculture and livestock
    - ZC.ROLL
    - ZS.ROLL
    - ZW.ROLL
    - KE.ROLL
    - ZL.ROLL
    - ZM.ROLL
    - LE.ROLL
    - HE.ROLL
    - GF.ROLL
  venue: GLBX
  schema: ohlcv-1d
  benchmark: ES.ROLL
  example_symbol: CL.ROLL
evaluation:
  n_splits: 5
  test_size: 0.15                # 5 x 15% of ~4,270 weekday closes: OOS from ~2014
  min_train: 252
  # Large capital so whole-contract rounding is negligible at 1/34 weight per root.
  initial_capital: 1000000000
  commission_rate: 0.0
  commission_per_contract: 2.0   # ~exchange + broker fees per contract per side
  slippage_prob: 0.0
  rebalance_band: 0.0
  leverage: 20.0                 # bond legs run at 10-25x their 1/N capital
screening:
  engine: vector
  sampler: grid
  space:
    basis_weight: [0.0, 1.0, 2.0]       # off (baseline), a third of the risk, about half
    basis_lookback: [252]
    lookback: [189]
    long_only: ["equity"]
    carry_weight: [0.0]
    portfolio_vol_target: [0.10]
    vol_target: [0.40]
    vol_lookback: [63]
    max_leverage: [50.0]
    rebal_freq: [21]
    cov_lookback: [126]
    max_portfolio_scale: [2.0]
validation:
  top_k: 3
