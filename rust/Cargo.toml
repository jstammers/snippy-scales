[workspace]
resolver = "2"
members = [
    "algo-core",
    "algo-pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
# Async + concurrency
tokio = { version = "1", features = ["full"] }
rayon = "1.10"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numeric
statrs = "0.17"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PyO3
pyo3 = { version = "0.28", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1   # faster incremental without sacrificing too much speed
